services:
  ilms-client:
    image: ilms-client
    container_name: ilms-client
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - NEXT_PUBLIC_CLIENT_API_URL=${NEXT_PUBLIC_CLIENT_API_URL}
        - NEXT_PUBLIC_SERVER_API_URL=${NEXT_PUBLIC_SERVER_API_URL}
    environment:
      NODE_ENV: production
    env_file:
      - .env
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.services.ilms-fe.loadbalancer.server.port=3000'
      - 'traefik.http.routers.ilms-fe.rule=Host(`ilms.gzrcloud.com`)'
      - 'traefik.http.routers.ilms-fe.entryPoints=websecure'
      - 'traefik.http.routers.ilms-fe.tls=true'
      - 'traefik.http.routers.ilms-fe.tls.certresolver=letsencrypt'

      - 'traefik.http.routers.ilms-fe-http.rule=Host(`ilms.gzrcloud.com`)'
      - 'traefik.http.routers.ilms-fe-http.entrypoints=web'
      - 'traefik.http.routers.ilms-fe-http.middlewares=https-redirect'
      - 'traefik.http.middlewares.https-redirect.redirectscheme.scheme=https'
    ports:
      - 3000:3000
    networks:
      - ilms-network

networks:
  ilms-network:
    driver: bridge
    external: true
